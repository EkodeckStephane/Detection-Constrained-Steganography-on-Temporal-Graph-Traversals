name: ASOC V2 causal checks

on:
  push:
    branches:
      - asoc-v2-causal-control
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run causal and controller tests
        run: |
          pytest -q tests/test_steganalysis_samples.py tests/test_phase6_fuzzy.py tests/test_phase5_coding.py tests/test_temporal_model.py
      - name: Run full unit suite
        run: pytest -q tests
      - name: Validate project structure
        run: python scripts/validate_project.py
