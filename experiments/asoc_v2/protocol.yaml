campaign: asoc_v2_causal_detector_constrained_control
status: design_only_until_sealed_freeze

scientific_object:
  state_recursion: emitted_action
  carrier: temporal_graph_continuation
  objective: maximize_payload_under_detectability_and_decodability_constraints

splits:
  target_fractions:
    cover_train: 0.55
    eve_train: 0.15
    policy_validation: 0.15
    sealed_test: 0.15
  preserve_timestamp_ties: true
  preserve_whole_sequences_or_sessions: true
  boundary_policy: choose_causal_sequence_safe_boundaries_nearest_target_fractions
  report_effective_fractions: true
  eve_train_internal_split:
    detector_fit_fraction: 0.75
    orientation_calibration_fraction: 0.25
    chronological: true
    preserve_timestamp_ties: true
    policy_validation_access: false
    sealed_test_access: false
  t_drive:
    rationale: sessions_do_not_cross_midnight_and_intra_day_quantile_cuts_discard_too_many_sessions
    fixed_day_end_boundaries_utc:
      - '2008-02-05T23:59:59Z'
      - '2008-02-06T23:59:59Z'
      - '2008-02-07T23:59:59Z'
    effective_point_fractions:
      cover_train: 0.6153394870958454
      eve_train: 0.14407173676628615
      policy_validation: 0.137354843489793
      sealed_test: 0.10323393264807543
    boundary_quarantine_sessions: 0

datasets:
  - id: tgbl-wiki
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: observed_outgoing_with_global_catalog_for_unseen_actor
  - id: mooc
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: observed_outgoing_with_global_catalog_for_unseen_actor
  - id: lastfm
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: observed_outgoing_with_global_catalog_for_unseen_actor
  - id: geolife_cells
    transition_semantics: walk
    cover_history_mode: walk_source
    admissibility: observed_outgoing_only
  - id: t_drive_cells
    transition_semantics: walk
    cover_history_mode: walk_source
    admissibility: observed_outgoing_only

sampling:
  row_policy: chronological
  max_rows_per_region: null
  sensitivity_caps:
    - 10000
    - 25000
    - 50000
    - null

cover_model:
  primary: temporal_backoff_restricted_to_admissible_support
  prior_strength: 8.0
  top_k: 32
  diagnostics:
    - gru
    - transformer
    - temporal_gnn

policy:
  modes:
    - EMBED
    - COVER
    - PAUSE
    - STOP
  stop_semantics: terminate_covert_session_then_follow_valid_cover_continuations
  pause_semantics: emit_valid_cover_continuation_without_consuming_payload
  primary: optimized_takagi_sugeno
  steganalysis_risk_input: maximum_oriented_design_eve_score
  optimization:
    algorithm: differential_evolution
    implementation: scipy.optimize.differential_evolution
    seed: 20260827
    population_size: 8
    generations: 8
    polish: false
    workers: 1
    region: policy_validation_only
    tuned_parameters:
      - opportunity_entropy_weight
      - opportunity_payload_weight
      - cover_entropy_weight
      - pause_risk_weight
      - stop_dead_end_weight
      - abstention_cover_weight
      - abstention_pause_weight
      - abstention_stop_weight
      - stop_threshold
    parameter_bounds:
      consequence_weights: [0.0, 1.0]
      stop_threshold: [0.80, 0.99]
    final_selection: lexicographic_feasibility_then_payload_then_completion_then_lower_worst_auc_then_lower_abstention
    sealed_metrics_visible_to_optimizer: false
  baselines:
    - fixed_entropy_threshold
    - hand_tuned_fuzzy
    - detector_unaware_range
    - random_admissible
    - coupling_inspired_distribution_preserving
  optional_reference:
    - learned_constrained_policy

steganalysis:
  detector_auc_budget: 0.60
  primary_auc: adversarial_auc_max_of_auc_and_one_minus_auc
  selection_rule: max_payload_with_validation_worst_eve_auc_ci_upper_at_or_below_budget
  design_eves:
    - linear
    - forest
  design_eve_training_intensities:
    - 0.05
    - 0.20
    - 0.50
    - 1.00
  score_orientation: frozen_on_eve_train_orientation_calibration_block
  risk_aggregation: maximum_oriented_score_across_design_eves
  unseen_eves:
    - mlp_public_features
    - gru_sequence
    - transformer_sequence
    - temporal_gnn
    - white_box_diagnostic
  test_policy: sealed_once_frozen

uncertainty:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  worst_eve_bootstrap: resample_clusters_then_take_max_adversarial_auc_across_design_eves_per_replicate
  cluster_unit_priority:
    - sequence_id
    - source
  message_seeds:
    - 11
    - 23
    - 37
    - 53
    - 71
  interpretation_of_message_seeds: technical_stochastic_repeats

metrics:
  communication:
    - bits_per_transition
    - bits_per_trajectory
    - completion_rate
  reliability:
    - bit_error_rate
    - passive_decode_success_rate
    - passive_state_mismatch_rate
    - invalid_transition_rate
  detection:
    - auc
    - adversarial_auc
    - tpr_at_1pct_fpr
    - tpr_at_5pct_fpr
  control:
    - embed_rate
    - cover_rate
    - pause_rate
    - stop_rate
  distribution:
    - local_kl_bits
    - local_total_variation
    - js_distance
    - mmd

hard_gates:
  zero_payload_public_feature_difference: 0.0
  zero_payload_adversarial_auc: 0.5
  passive_state_mismatch_rate: 0.0
  passive_decode_success_rate: 1.0
  invalid_transition_rate: 0.0
  sealed_test_may_change_policy: false

provenance:
  output_root: results_final
  require_commit_sha: true
  require_config_sha256: true
  require_dataset_manifest_sha256: true
  require_seed_record: true
