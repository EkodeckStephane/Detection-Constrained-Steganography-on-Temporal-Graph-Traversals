campaign: asoc_v2_causal_detector_constrained_control
status: final_holdout_reserved_not_opened

scientific_object:
  state_recursion: emitted_action
  carrier: temporal_graph_continuation
  objective: maximize_payload_under_detectability_and_decodability_constraints

splits:
  target_fractions:
    cover_train: 0.55
    eve_train: 0.15
    policy_validation: 0.15
    development_test: 0.10
    final_holdout: 0.05
  preserve_timestamp_ties: true
  preserve_whole_sequences_or_sessions: true
  boundary_policy: choose_causal_sequence_safe_boundaries_nearest_target_fractions
  report_effective_fractions: true
  development_test_role: quarantine_pilot_accessible_post_validation_region_and_permit_engineering_diagnostics_before_final_freeze
  final_holdout_role: untouched_publication_test_never_used_for_model_detector_threshold_policy_baseline_or_narrative_selection
  eve_train_internal_split:
    detector_fit_fraction: 0.75
    orientation_calibration_fraction: 0.25
    chronological: true
    preserve_timestamp_ties: true
    policy_validation_access: false
    development_test_access: false
    final_holdout_access: false
  t_drive:
    rationale: sessions_do_not_cross_midnight_and_intra_day_quantile_cuts_discard_too_many_sessions
    design_day_end_boundaries_utc:
      - '2008-02-05T23:59:59Z'
      - '2008-02-06T23:59:59Z'
      - '2008-02-07T23:59:59Z'
    final_boundary: session_safe_boundary_inside_2008_02_08_to_reserve_last_five_percent_of_all_points
    boundary_quarantine_sessions: 2164
    boundary_quarantine_points: 332079

datasets:
  - id: tgbl-wiki
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: public_catalog_with_probabilities_learned_only_from_cover_train
    cover_pause_emission: passthrough_observed_natural_action
  - id: mooc
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: public_catalog_with_probabilities_learned_only_from_cover_train
    cover_pause_emission: passthrough_observed_natural_action
  - id: lastfm
    transition_semantics: actor_action
    cover_history_mode: actor_history
    admissibility: public_catalog_with_probabilities_learned_only_from_cover_train
    cover_pause_emission: passthrough_observed_natural_action
  - id: geolife_cells
    transition_semantics: walk
    cover_history_mode: walk_source
    admissibility: observed_outgoing_only
    cover_pause_emission: preserve_observed_natural_before_divergence_then_sample_secret_independent_continuation_from_current_admissible_cover_distribution
  - id: t_drive_cells
    transition_semantics: walk
    cover_history_mode: walk_source
    admissibility: observed_outgoing_only
    cover_pause_emission: preserve_observed_natural_before_divergence_then_sample_secret_independent_continuation_from_current_admissible_cover_distribution

sampling:
  row_policy: chronological
  max_rows_per_region: null
  sensitivity_caps:
    - 10000
    - 25000
    - 50000
    - null

communication_session:
  payload_type: encrypted_near_uniform_bits
  primary_payload_bits: 32
  sensitivity_payload_bits:
    - 16
    - 64
  arithmetic_precision_bits: 128
  actor_action_unit: one_session_per_source_per_evaluation_region
  walk_unit: one_session_per_trajectory_or_mobility_session
  restart_after_completion_within_unit: false
  restart_after_stop_within_unit: false
  after_completion_or_stop: follow_cover_without_consuming_payload
  rate_measurement: committed_arithmetic_prefix_gain_divided_by_observed_transitions
  nominal_controller_bits_are_not_reported_as_committed_payload

cover_model:
  primary: temporal_backoff_restricted_to_admissible_support
  prior_strength: 8.0
  top_k: 32
  diagnostics:
    - gru
    - transformer
    - temporal_gnn

policy:
  modes:
    - EMBED
    - COVER
    - PAUSE
    - STOP
  stop_semantics: terminate_current_covert_session_then_follow_valid_cover_continuations
  pause_semantics: emit_valid_cover_continuation_without_consuming_payload
  actor_action_cover_semantics: preserve_observed_natural_action_when_not_embedding
  walk_cover_semantics: preserve_observed_natural_before_divergence_then_sample_valid_cover_continuation_from_current_emitted_state
  primary: optimized_takagi_sugeno
  steganalysis_risk_input: chance_referenced_public_top_cover_design_eve_advantage
  steganalysis_risk_transform: max_0_2_times_oriented_stego_posterior_minus_0_5
  optimization:
    algorithm: differential_evolution
    implementation: scipy.optimize.differential_evolution
    seed: 20260827
    population_size: 8
    generations: 8
    polish: false
    workers: 1
    region: policy_validation_only
    search_stage:
      deterministic_evenly_spaced_rows: 3000
      outcome_features_used_for_row_selection: false
      purpose: propose_candidate_shortlist_only
      shortlist_size: 12
    certification_stage:
      rows: full_policy_validation_region
      message_seeds: all_declared_message_seeds
      bootstrap_resamples_per_seed: 10000
      candidate_feasible_only_if_every_seed_auc_ci_upper_at_or_below_budget: true
      final_ranking: mean_payload_then_mean_completion_then_lower_max_auc_ci_upper_then_lower_mean_abstention
    tuned_parameters:
      - opportunity_entropy_weight
      - opportunity_payload_weight
      - cover_entropy_weight
      - pause_risk_weight
      - stop_dead_end_weight
      - abstention_cover_weight
      - abstention_pause_weight
      - abstention_stop_weight
      - stop_threshold
    parameter_bounds:
      consequence_weights: [0.0, 1.0]
      stop_threshold: [0.80, 0.99]
    development_metrics_visible_to_optimizer: false
    final_holdout_metrics_visible_to_optimizer: false
  baselines:
    - fixed_entropy_threshold
    - hand_tuned_fuzzy
    - detector_unaware_causal_arithmetic
    - random_admissible
    - coupling_inspired_distribution_preserving
  optional_reference:
    - learned_constrained_policy

steganalysis:
  detector_auc_budget: 0.60
  primary_auc: adversarial_auc_max_of_auc_and_one_minus_auc
  selection_rule: full_validation_certified_max_payload_with_every_seed_worst_eve_auc_ci_upper_at_or_below_budget
  design_eves:
    - linear
    - forest
  design_eve_training_intensities:
    - 0.05
    - 0.20
    - 0.50
    - 1.00
  score_orientation: frozen_on_eve_train_orientation_calibration_block
  risk_aggregation: maximum_oriented_score_across_design_eves
  controller_risk_mapping: chance_referenced_advantage_zero_at_posterior_0_5
  unseen_eves:
    - mlp_public_features
    - gru_sequence
    - transformer_sequence
    - temporal_gnn
    - white_box_diagnostic
  unseen_eve_rule: trained_after_policy_freeze_without_policy_feedback_and_evaluated_only_on_final_holdout
  final_test_policy: open_final_holdout_once_after_freeze_manifest_verification

uncertainty:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  worst_eve_bootstrap: resample_clusters_then_take_max_adversarial_auc_across_design_eves_per_replicate
  cluster_unit_priority:
    - sequence_id
    - source
  message_seeds:
    - 11
    - 23
    - 37
    - 53
    - 71
  interpretation_of_message_seeds: technical_stochastic_repeats

metrics:
  communication:
    - bits_per_transition
    - bits_per_trajectory
    - completion_rate
  reliability:
    - bit_error_rate
    - passive_decode_success_rate
    - passive_state_mismatch_rate
    - invalid_transition_rate
  detection:
    - auc
    - adversarial_auc
    - tpr_at_1pct_fpr
    - tpr_at_5pct_fpr
  control:
    - embed_rate
    - cover_rate
    - pause_rate
    - stop_rate
  distribution:
    - local_kl_bits
    - local_total_variation
    - js_distance
    - mmd

hard_gates:
  zero_payload_public_feature_difference: 0.0
  zero_payload_adversarial_auc: 0.5
  passive_state_mismatch_rate: 0.0
  passive_decode_success_rate: 1.0
  invalid_transition_rate: 0.0
  final_holdout_may_change_policy: false
  final_holdout_may_change_baseline_hyperparameters: false

provenance:
  output_root: results_final
  require_commit_sha: true
  require_config_sha256: true
  require_dataset_manifest_sha256: true
  require_seed_record: true
  require_frozen_policy_sha256: true
  require_design_results_sha256: true
  require_freeze_manifest_fingerprint: true
